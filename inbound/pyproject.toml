[project]
name = "jambonz-chatbot-inbound"
version = "0.1.0"
description = "jambonz inbound calling example for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[websocket,openai,silero,deepgram,runner]>=1.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.11,<1",
    "websockets>=13",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
